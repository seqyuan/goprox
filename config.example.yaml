# GoProx 用户配置示例（仅供参考，结构参考）
#
# 实际运行时配置由程序自动生成在 <程序目录>/config/ 下，无需手动创建本文件：
#   - 用户配置：<程序目录>/config/users/<用户名>.yaml（goprox user <name> 创建）
#   - 网关状态：<程序目录>/config/state.yaml（首次 serve 自动生成）
#
# 下面展示单个用户配置文件支持的全部字段。

auth:
  # bcrypt 哈希（goprox user / goprox passwd 生成，形如 $2a$10$...）。
  # 旧版 64 位 hex SHA-256 哈希仍可登录（自动兼容）。
  password_hash: "$2a$10$YVpm1R6puQFltjmrKziLsujVtAJDJIynTC54yESGslrkmyP5ORBTO"
  # 可选：TOTP 两步验证密钥（base32）。开启后登录需密码 + 6 位动态码。
  # 由网页「设置两步验证」自动生成，或管理员手动填写；删除本行即关闭。
  # totp_secret: "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"

# 可选：默认服务（服务 ID）。未认领的裸路径（网关根路径下不属于任何服务、也不是
# 网关自身的路径）会确定性地路由到该服务——适合根路由型 SPA（Nuxt/Next 客户端路由）
# 在网关根路径下零改动运行。不配置则裸路径按 Referer → 最近访问路由 cookie 转发。
# default_service: web

services:
  # ① 本机服务：后端与网关在同一台机器，host 用 127.0.0.1
  - id: jupyter
    name: "Jupyter Lab"
    description: "交互式笔记本"
    host: "127.0.0.1"
    port: 8888
    path: "/jupyter"                # 前端访问路径（只允许 A-Z a-z 0-9 . _ ~ - 与 /）
    websocket: true                 # 是否允许 WebSocket 升级
    category: "开发工具"
    order: 0
    # bwlimit: 10485760              # 可选：该服务带宽上限（字节/秒，0/缺省 = 不限速）

  # ② 局域网其他机器：host 填对方机器的局域网 IP（如实验室服务器 192.168.0.109）
  - id: rstudio
    name: "RStudio（服务器）"
    description: "运行在 192.168.0.109 的 RStudio Server"
    host: "192.168.0.109"
    port: 8787
    path: "/rstudio"
    websocket: true
    category: "开发工具"
    order: 1

  # ③ 单 HTML 网页：后端只提供一个入口文件（如数据分析报告）
  - id: report
    name: "分析报告"
    description: "单 HTML 网页报告"
    host: "127.0.0.1"
    port: 8080
    path: "/report"
    websocket: false
    category: "未分类"
    order: 2
    backend_path: "/report.html"    # 后端入口文件（含扩展名时子资源解析到其目录）
