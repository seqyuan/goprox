<style>
  .nf-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .nf-code {
    font-size: clamp(64px, 12vw, 96px);

    letter-spacing: -0.03em;
