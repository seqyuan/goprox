<style>
  /* ── Sticky glass nav (blur only where it overlaps scrolling content) ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--pad-x);
    height: 54px;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(245,245,247,0.72);
    -webkit-backdrop-filter: saturate(180%%) blur(20px);
    backdrop-filter: saturate(180%%) blur(20px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .dark .header { background: rgba(22,22,23,0.72); }
  /* hairline appears only once content actually scrolls beneath (see script.js) */
  .header.scrolled { border-bottom-color: var(--border); box-shadow: 0 1px 12px rgba(0,0,0,0.04); }
  .header h1 {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .account { position: relative; }
  .account-btn {
    background: rgba(0,0,0,0.05);
    color: var(--text);
    height: 40px;
    max-width: 160px;
    padding: 0 14px;
    border-radius: var(--r-pill);
    font-size: 13px;
    font-weight: 550;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dark .account-btn { background: rgba(255,255,255,0.1); }
  .account-btn:hover { background: rgba(0,0,0,0.09); }
  .dark .account-btn:hover { background: rgba(255,255,255,0.16); }
  .account-menu {
    position: absolute;
    right: 0;
    top: calc(100%% + 8px);
    min-width: 196px;
    padding: 6px;
    background: var(--bg-panel);
    border-radius: 14px;
    box-shadow: var(--sh-panel);
    z-index: 60;
  }
  .account-menu[hidden] { display: none; }
  .account-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%%;
    text-align: left;
    background: transparent;
    color: var(--text);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .account-item:hover { background: var(--hover); text-decoration: none; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: var(--r-pill);
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--sh-card);
  }
  .add-btn:hover { background: var(--accent-hover); }
  .theme-btn { width: 40px; height: 40px; }

  /* ── Main grid (dense column) ── */
  .main {
    max-width: var(--max-grid);
    margin: 0 auto;
    padding: clamp(24px, 4vw, 44px) var(--pad-x) 64px;
  }
  .hint { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
  .hint code { font-family: var(--mono); font-size: 12px; }
  .service-search {
    display: block;
    width: 100%%;
    max-width: 360px;
    margin-bottom: 18px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    background: var(--bg-panel);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
  }
  .service-search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  .service-search[hidden] { display: none; }
  .category-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .category-chip {
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 550;
    box-shadow: var(--sh-card);
  }
  .category-chip:hover { background: var(--hover); }

  /* ── Category blocks ── */
  .category-block { margin-bottom: clamp(28px, 4vw, 40px); scroll-margin-top: 70px; }
  .category-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    min-height: 3rem;
  }
  .card-grid.drop-target { outline: 2px dashed var(--accent); outline-offset: 4px; }

  /* ── Service cards (white surface, gentle hover lift) ── */
  .service-card {
    background: var(--bg-panel);
    border-radius: var(--r-card);
    box-shadow: var(--sh-card);
    transition: transform 0.2s var(--ease-out-quart), box-shadow 0.2s var(--ease-out-quart);
    position: relative;
  }
  .service-card:hover { transform: translateY(-3px); box-shadow: var(--sh-lift); }
  .service-card.dragging { opacity: 0.45; }
  .card-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px 0;
  }
  /* Fine pointers: keep the open-service hit target clear until hover or focus. */
  @media (hover: hover) and (pointer: fine) {
    .card-toolbar {
      position: absolute;
      z-index: 2;
      top: 8px;
      right: 8px;
      left: auto;
      width: auto;
      padding: 2px;
      border-radius: 12px;
      background: var(--bg-panel);
      box-shadow: var(--sh-card);
      opacity: 0;
      pointer-events: none;
    }
    .card-toolbar button,
    .card-toolbar .drag-handle { pointer-events: none; }
    .service-card:hover .card-toolbar,
    .service-card:focus-within .card-toolbar { opacity: 1; pointer-events: auto; }
    .service-card:hover .card-toolbar button,
    .service-card:hover .card-toolbar .drag-handle,
    .service-card:focus-within .card-toolbar button,
    .service-card:focus-within .card-toolbar .drag-handle { pointer-events: auto; }
  }
  .is-filtering .drag-handle,
  .is-filtering .card-move { display: none; }
  .drag-handle {
    cursor: grab;
    color: var(--text-muted);
    font-size: 0.9rem;
    user-select: none;
    padding: 4px 6px;
    border-radius: var(--r-pill);
  }
  .drag-handle:active { cursor: grabbing; }
  .card-actions { display: flex; gap: 2px; }
  .card-edit, .card-delete, .card-move {
    background: transparent;
    border: none;
    font-size: 15px;
    line-height: 1;
    padding: 6px 8px;
    border-radius: var(--r-pill);
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }
  .card-edit:hover, .card-move:hover { color: var(--text); background: var(--hover); }
  .card-delete:hover { color: var(--danger); background: var(--danger-bg); }
  .card-move:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .card-link {
    display: flex;
    gap: 14px;
    padding: 8px 18px 18px;
    color: inherit;
    text-decoration: none;
  }
  .card-link:hover { text-decoration: none; }
  .card-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: var(--r-thumb);
    background: var(--hover);
  }
  .card-icon img { width: 100%%; height: 100%%; object-fit: contain; }
  /* fallback monogram: one consistent accent gradient, not per-letter colors */
  .card-letter {
    display: none;
    width: 100%%;
    height: 100%%;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.25rem;
    color: #fff;
    border-radius: var(--r-thumb);
    background: var(--grad-cta);
  }
  .card-body { flex: 1; min-width: 0; }
  .card-body h2 { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .card-desc { color: var(--text-muted); font-size: 13px; line-height: 1.5; }
  .empty { text-align: center; color: var(--text-muted); padding: 3.5rem 1rem; }

  /* ── Modal sheet (glass materializes over the dimmed page) ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    overflow-y: auto; /* taller-than-viewport sheets stay reachable (top not clipped) */
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 1rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s var(--ease-out-quart), visibility 0.25s;
  }
  .dark .modal-backdrop { background: rgba(0,0,0,0.55); }
  .modal-backdrop.open { opacity: 1; visibility: visible; }
  .modal {
    width: 100%%;
    max-width: 420px;
    margin: auto; /* centers when it fits; keeps the top reachable when it overflows */
    max-height: calc(100vh - 2rem);
    max-height: calc(100dvh - 2rem);
    overflow-y: auto; /* long forms scroll inside the sheet instead of clipping */
    background: rgba(250,250,252,0.78);
    -webkit-backdrop-filter: saturate(180%%) blur(20px);
    backdrop-filter: saturate(180%%) blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--r-panel);
    box-shadow: var(--sh-overlay);
    padding: 24px;
    transform: translateY(10px) scale(0.98);
    opacity: 0;
    transition: transform 0.32s var(--ease-spring), opacity 0.22s var(--ease-out-quart);
  }
  .dark .modal { background: rgba(28,28,30,0.78); }
  .modal-backdrop.open .modal { transform: none; opacity: 1; }
  .modal h2 { margin-bottom: 18px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .modal label {
    display: block;
    margin: 14px 0 6px;
    font-size: 13px;
    font-weight: 550;
    color: var(--text-muted);
  }
  .modal input[type="text"],
  .modal input[type="number"] {
    width: 100%%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-thumb);
    background: var(--bg-panel);
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  .dark .modal input:focus { box-shadow: 0 0 0 3px rgba(41,151,255,0.25); }
  .modal .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 14px;
    color: var(--text);
  }
  .modal .checkbox-row input { accent-color: var(--accent); width: 16px; height: 16px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
  }
  .btn-secondary {
    background: rgba(0,0,0,0.05);
    color: var(--text);
    padding: 10px 18px;
    border-radius: var(--r-pill);
    font-size: 14px;
    font-weight: 550;
    transition: background 0.15s var(--ease-out-quart);
  }
  .dark .btn-secondary { background: rgba(255,255,255,0.1); }
  .btn-secondary:hover { background: rgba(0,0,0,0.09); }
  .dark .btn-secondary:hover { background: rgba(255,255,255,0.16); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    border-radius: var(--r-pill);
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: progress; }
  .advanced {
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 4px;
  }
  .advanced summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin: 8px 0 4px;
  }
  .field-help, .path-preview {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
    margin-top: 6px;
  }
  .path-preview:empty { display: none; }
  .form-error { color: var(--danger); font-size: 13px; margin-top: 12px; }
  .form-error[hidden] { display: none; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    left: 50%%;
    bottom: 2.5rem;
    transform: translateX(-50%%);
    background: var(--bg-panel);
    box-shadow: var(--sh-panel);
    padding: 10px 18px;
    border-radius: var(--r-pill);
    display: none;
    /* Below the modal backdrop (30): a toast must never sit on top of an
       open sheet, and form errors are reported inline instead. */
    z-index: 25;
    font-size: 14px;
  }
  .toast.show { display: block; }

  .read-only .drag-handle,
  .read-only .card-move,
  .read-only .card-edit,
  .read-only .card-delete,
  .read-only .add-btn { display: none; }
</style>
<header class="header">
  <h1>%s</h1>
  <div class="header-actions">
    <button type="button" class="add-btn" id="fab-add" title="添加服务" aria-label="添加服务">+</button>
    <div class="account">
      <button type="button" class="account-btn" id="account-toggle" aria-expanded="false" aria-controls="account-menu">%s</button>
      <div class="account-menu" id="account-menu" hidden>
        <a class="account-item" href="/2fa/setup">%s</a>
        <button type="button" class="account-item" id="theme-toggle"><span class="theme-ico">🌙</span> 外观</button>
        <a class="account-item" href="/logout">退出</a>
      </div>
    </div>
  </div>
</header>
<main class="main%s">
  %s
  <input id="service-search" class="service-search" type="search" placeholder="搜索名称或说明" autocomplete="off" aria-label="搜索服务"%s>
  <div id="dashboard">%s</div>
</main>
<datalist id="category-options"></datalist>
<div class="modal-backdrop" id="add-modal">
  <form class="modal" id="add-form" data-busy-label="正在添加">
    <h2>添加服务</h2>
    <label for="add-name">显示名称</label>
    <input id="add-name" name="name" type="text" required>
    <label for="add-description">说明</label>
    <input id="add-description" name="description" type="text">
    <label for="add-host">后端地址</label>
    <input id="add-host" name="host" type="text" value="127.0.0.1" required>
    <label for="add-port">端口</label>
    <input id="add-port" name="port" type="number" min="1" max="65535" required>
    <label for="add-category">分类</label>
    <input id="add-category" name="category" type="text" list="category-options" autocomplete="off" placeholder="选择已有分类，或输入新分类">
    <details class="advanced" id="add-advanced">
      <summary>高级</summary>
      <label for="add-path">前端路径</label>
      <input id="add-path" name="path" type="text" placeholder="留空则自动生成">
      <p class="path-preview" id="add-path-preview"></p>
      <label for="add-backend-path">后端路径</label>
      <input id="add-backend-path" name="backend_path" type="text" placeholder="留空则转发到根路径，例如 /app/index.html">
      <label class="checkbox-row">
        <input id="add-ws" name="websocket" type="checkbox" checked>
        <span>WebSocket 代理</span>
      </label>
      <p class="field-help">Jupyter、RStudio 等需要保持开启。关闭后将拒绝 WebSocket 连接。</p>
      <label for="add-bwlimit">带宽上限 <small style="color:var(--text-muted)">MB/s，留空不限速</small></label>
      <input id="add-bwlimit" name="bwlimit" type="number" min="0" step="any" placeholder="例如 10">
    </details>
    <p class="form-error" id="add-error" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="add-cancel">取消</button>
      <button type="submit" class="btn-primary">添加</button>
    </div>
  </form>
</div>
<div class="modal-backdrop" id="edit-modal">
  <form class="modal" id="edit-form">
    <h2>编辑服务</h2>
    <input type="hidden" id="edit-id" value="">
    <label for="edit-name">显示名称</label>
    <input id="edit-name" name="name" type="text" required>
    <label for="edit-description">说明</label>
    <input id="edit-description" name="description" type="text">
    <label for="edit-host">后端地址</label>
    <input id="edit-host" name="host" type="text" required>
    <label for="edit-port">端口</label>
    <input id="edit-port" name="port" type="number" min="1" max="65535" required>
    <label for="edit-category">分类</label>
    <input id="edit-category" name="category" type="text" list="category-options" autocomplete="off" placeholder="选择已有分类，或输入新分类">
    <details class="advanced" id="edit-advanced">
      <summary>高级</summary>
      <label for="edit-path">前端路径</label>
      <input id="edit-path" name="path" type="text">
      <p class="path-preview" id="edit-path-preview"></p>
      <label for="edit-backend-path">后端路径</label>
      <input id="edit-backend-path" name="backend_path" type="text" placeholder="留空则转发到根路径，例如 /app/index.html">
      <label class="checkbox-row">
        <input id="edit-ws" name="websocket" type="checkbox">
        <span>WebSocket 代理</span>
      </label>
      <p class="field-help">Jupyter、RStudio 等需要保持开启。关闭后将拒绝 WebSocket 连接。</p>
      <label for="edit-bwlimit">带宽上限 <small style="color:var(--text-muted)">MB/s，留空不限速</small></label>
      <input id="edit-bwlimit" name="bwlimit" type="number" min="0" step="any" placeholder="例如 10">
    </details>
    <p class="form-error" id="edit-error" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="edit-cancel">取消</button>
      <button type="submit" class="btn-primary">保存</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>
<script>window.__GOPROX_BOOT__ = %s;</script>
<script>%s</script>
